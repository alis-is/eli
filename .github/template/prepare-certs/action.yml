name: prepare-certs
description: download the CA bundle once for all build jobs

runs:
  using: composite
  steps:
    - name: download CA bundle
      shell: sh
      run: |
        mkdir .ca-certs
        curl --fail --location --retry 3 --retry-all-errors \
          --connect-timeout 30 --max-time 60 \
          --output .ca-certs/roots.pem \
          'https://ccadb.my.salesforce-sites.com/mozilla/IncludedRootsPEMTxt?TrustBitsInclude=Websites'
    - uses: actions/upload-artifact@v4
      with:
        name: bundled-ca-certificates
        path: .ca-certs/roots.pem
        if-no-files-found: error
