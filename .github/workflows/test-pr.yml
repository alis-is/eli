name: test-pr

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
    
jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: build-n-cache
      uses: "./.github/template/build-n-cache"
      with:
        toolchain: zig:x86_64-linux-musl
        artifact-id: eli-linux-x86_64
        debug-artifact-id: eli-linux-x86_64-debug
    - name: test native
      uses: addnab/docker-run-action@v3
      with:
        image: ghcr.io/alis-is/eli-build:latest
        run: cmake -S . -B build/x86_64-linux-musl -DCMAKE_TOOLCHAIN_FILE=misc/toolchains/zig/toolchain.cmake -DCLANG_TARGET=x86_64-linux-musl -DCMAKE_SYSTEM_NAME=Linux -DELI_BUILD_TESTS=ON && cmake --build build/x86_64-linux-musl -j2 && ctest --test-dir build/x86_64-linux-musl --output-on-failure
        options: -w /root/luabuild -v ${{ github.workspace }}:/root/luabuild
    - name: test dependency patches
      run: ./release/eli-linux-x86_64 tools/patches/deps-test.lua
    - name: test watchdog
      run: python3 tools/tests/watchdog.py
    - name: test interpreter argv0 quoting
      run: python3 tools/tests/interpreter_argv0.py ./release/eli-linux-x86_64
  build-linux-aarch64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: build-n-cache
      uses: "./.github/template/build-n-cache"
      with:
        toolchain: zig:aarch64-linux-musl
        artifact-id: eli-linux-aarch64
        debug-artifact-id: eli-linux-aarch64-debug
  build-linux-riscv64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: build-n-cache
      uses: "./.github/template/build-n-cache"
      with:
        toolchain: zig:riscv64-linux-musl
        artifact-id: eli-linux-riscv64
        debug-artifact-id: eli-linux-riscv64-debug

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: build-n-cache
        uses: "./.github/template/build-n-cache"
        with:
          toolchain: zig:x86_64-windows-gnu
          artifact-id: eli-windows-x86_64.exe
          debug-artifact-id: eli-windows-x86_64-debug.exe
      - name: build native Windows tests
        uses: addnab/docker-run-action@v3
        with:
          image: ghcr.io/alis-is/eli-build:latest
          run: cmake -S . -B build/x86_64-windows-gnu -DCMAKE_TOOLCHAIN_FILE=misc/toolchains/zig/toolchain.cmake -DCLANG_TARGET=x86_64-windows-gnu -DCMAKE_SYSTEM_NAME=Windows -DELI_BUILD_TESTS=ON && cmake --build build/x86_64-windows-gnu --target eli_worker_constructor_test eli_worker_deadline_native_test eli_worker_deadline_time32_test eli_proc_windows_handle_list_test -j2
          options: -w /root/luabuild -v ${{ github.workspace }}:/root/luabuild
      - name: stage native Windows tests
        run: |
          mkdir -p native-out
          cp build/x86_64-windows-gnu/deps/eli-worker/tests/eli_worker_constructor_test.exe native-out/
          cp build/x86_64-windows-gnu/deps/eli-worker/tests/eli_worker_deadline_native_test.exe native-out/
          cp build/x86_64-windows-gnu/deps/eli-worker/tests/eli_worker_deadline_time32_test.exe native-out/
          cp build/x86_64-windows-gnu/deps/eli-proc-extra/tests/eli_proc_windows_handle_list_test.exe native-out/
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: native-out/

  build-windows-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: build-n-cache
        uses: "./.github/template/build-n-cache"
        with:
          toolchain: zig:aarch64-windows-gnu
          artifact-id: eli-windows-aarch64.exe
          debug-artifact-id: eli-windows-aarch64-debug.exe

  build-macos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: build-n-cache
        uses: "./.github/template/build-n-cache"
        with:
          toolchain: zig:aarch64-macos-none
          artifact-id: eli-macos-aarch64
          debug-artifact-id: eli-macos-aarch64-debug
      - name: build native macOS tests
        uses: addnab/docker-run-action@v3
        with:
          image: ghcr.io/alis-is/eli-build:latest
          run: cmake -S . -B build/aarch64-macos-native -DCMAKE_TOOLCHAIN_FILE=misc/toolchains/zig/toolchain.cmake -DCLANG_TARGET=aarch64-macos-none -DCMAKE_SYSTEM_NAME=Darwin -DELI_BUILD_TESTS=ON && cmake --build build/aarch64-macos-native --target eli_worker_constructor_test eli_worker_deadline_native_test eli_worker_deadline_time32_test signal_coordination eli_proc_user_lookup_test eli_tls_io_test eli_tls_options_test eli_plaintext_io_test -j2
          options: -w /root/luabuild -v ${{ github.workspace }}:/root/luabuild
      - name: stage native macOS tests
        run: |
          mkdir -p native-out
          cp build/aarch64-macos-native/deps/eli-worker/tests/eli_worker_constructor_test native-out/
          cp build/aarch64-macos-native/deps/eli-worker/tests/eli_worker_deadline_native_test native-out/
          cp build/aarch64-macos-native/deps/eli-worker/tests/eli_worker_deadline_time32_test native-out/
          cp build/aarch64-macos-native/deps/eli-os-extra/tests/signal_coordination native-out/
          cp build/aarch64-macos-native/deps/eli-proc-extra/tests/eli_proc_user_lookup_test native-out/
          cp build/aarch64-macos-native/deps/lua-simple-socket/tests/eli_tls_io_test native-out/
          cp build/aarch64-macos-native/deps/lua-simple-socket/tests/eli_tls_options_test native-out/
          cp build/aarch64-macos-native/deps/lua-simple-socket/tests/eli_plaintext_io_test native-out/
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos-aarch64
          path: native-out/

  test-linux:
    runs-on: ubuntu-latest
    needs: [build-linux-x86_64,build-linux-aarch64, build-linux-riscv64]
    env:
      HTTPBIN_URL: http://localhost:80
    services:
      httpbin:
        image: kennethreitz/httpbin
        ports:
          - 80:80
    steps:
      - uses: actions/checkout@v4
      - uses: "./.github/template/prepare-test"
      - name: test x86_64
        uses: addnab/docker-run-action@v3
        with:
          image: ghcr.io/alis-is/eli-test:latest
          run: ./tools/test.sh x86_64
          options: -w /root/luabuild -v ${{ github.workspace }}:/root/luabuild -v ${{ github.workspace }}/toolchains:/opt/cross
      - name: test aarch64
        uses: addnab/docker-run-action@v3
        with:
          image: ghcr.io/alis-is/eli-test:latest
          run: ./tools/test.sh aarch64
          options: -w /root/luabuild -v ${{ github.workspace }}:/root/luabuild -v ${{ github.workspace }}/toolchains:/opt/cross
      - name: test riscv64
        uses: addnab/docker-run-action@v3
        with:
          image: ghcr.io/alis-is/eli-test:latest
          run: ./tools/test.sh riscv64
          options: -w /root/luabuild -v ${{ github.workspace }}:/root/luabuild -v ${{ github.workspace }}/toolchains:/opt/cross
          
  test-windows:
    runs-on: windows-latest
    needs: build-windows
    steps:
      - uses: actions/checkout@v4
      - uses: "./.github/template/prepare-test"
      - uses: actions/download-artifact@v4
        with:
          name: native-windows
          path: native-tests
      - name: test native Windows
        shell: pwsh
        run: |
          $tests = Get-ChildItem .\native-tests\*.exe
          if (-not $tests) { throw "no native Windows tests downloaded" }
          $tests | ForEach-Object {
            Write-Host "== $($_.Name)"
            & $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "native test failed: $($_.Name)" }
          }
      - name: test
        shell: pwsh
        run: |
          .\tools\test.ps1 x86_64

  test-macos:
    strategy:
      matrix:
        os: [macos-latest]
        arch: [arm64]
    runs-on: ${{ matrix.os }}
    needs: [build-macos] # we do not test aarch64 because there are no available aarch64 runners
    steps:
      - uses: actions/checkout@v4
      - uses: "./.github/template/prepare-test"
      - uses: actions/download-artifact@v4
        with:
          name: native-macos-aarch64
          path: native-tests
      - name: test native macOS
        run: |
          chmod +x native-tests/*
          for test in native-tests/*; do
            echo "== $test"
            "$test"
          done
      - name: test
        run: |
          ./tools/test.sh ${{ matrix.arch }}

  test-ami:
    runs-on: ubuntu-latest
    needs: [build-linux-x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: "./.github/template/prepare-test"
      - uses: actions/checkout@v4
        with:
          repository: alis-is/ami
          path: ami
      - name: test ami
        run: |
          cd ami
          ls -la tests/assets/cli/
          ../release/eli-linux-x86_64 tests/all.lua

  test-ascend:
    runs-on: ubuntu-latest
    needs: [build-linux-x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: "./.github/template/prepare-test"
      - uses: actions/checkout@v4
        with:
          repository: alis-is/ascend
          path: ascend
      - name: test ascend
        run: |
          cp release/eli-linux-x86_64 /usr/local/bin/eli
          cd ascend/tests
          ../../release/eli-linux-x86_64 all.lua
